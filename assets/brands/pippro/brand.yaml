name: pippro
type: child
inheritsFrom: vantage
label: PipPro
themeMode: both

android:
  applicationId: "com.pippro.app"
  appName: "PipPro"

ios:
  bundleId: "com.pippro.app"
  appName: "PipPro"

colors:
  primary: "#5F259E"
  secondary: "#F8F3FF"
  accent: "#FFC93C"
  splashColor: "#5F259E"
  launcherBackground: "#5F259E"

urls:
  api: "https://my.pipze.com/api/"
  websocket: "wss://my.pipze.com/trade-engine"
  chart: "https://my.pipze.com"

assets:
  appIcon: icon.png
  logo: logo.svg
  splashLogo: home_icon.png

features:
  useNewChart: false

# Universal links / App Links. Remove this block to disable deep linking for
# the flavor. Keys stay flat (no nested ios:/android:) because the brand
# parsers are line-based. iosTeamId / iosAppStoreId / androidSha256 only feed
# scripts/generate_well_known.dart; androidSha256 is comma-separated.
deepLink:
  host: my.pipze.com
  # hostAlt: www.example.com
  iosTeamId: 8WXRXCSTK2
  iosAppStoreId: "<PIPPRO_APP_STORE_ID>"
  androidSha256: "<PIPPRO_UPLOAD_SHA256>,<PIPPRO_PLAY_SIGNING_SHA256>"
