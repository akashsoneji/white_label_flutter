name: celestial
type: child
inheritsFrom: vantage
label: Celestial
themeMode: both//dark

android:
  applicationId: com.celestial.app
  appName: Celestial

ios:
  bundleId: com.celestial.app
  appName: Celestial

colors:
  primary: "#24324D"
  darkPrimary: "#22D3EE"
  secondary: "#22D3EE"
  accent: "#24324D"
  splashColor: "#24324D"
  launcherBackground: "#24324D"

urls:
  api: https://client.celestialtrader.com/api/
  websocket: wss://client.celestialtrader.com/trade-engine
  chart: https://client.celestialtrader.com

assets:
  appIcon: icon.png
  logo: logo.svg
  splashLogo: splash_logo.svg

# ✅ WebSocket configuration per brand
# Set unifiedStreamSocket to true to use the new single-socket path (/ws/stream with MessagePack)
# Set to false to use the legacy 5-socket path
featureFlags:
  unifiedStreamSocket: false
