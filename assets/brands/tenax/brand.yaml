name: tenax
type: child
inheritsFrom: vantage
label: Tenax
themeMode: both

android:
  applicationId: com.tenax.app
  appName: Tenax

ios:
  bundleId: com.tenax.app
  appName: Tenax

colors:
  primary: "#4A0C54"
  secondary: "#F8F3FF"
  accent: "#FFC93C"
  splashColor: "#4A0C54"
  launcherBackground: "#4A0C54"

urls:
  api: https://app.tenaxcode.com/api/
  websocket: wss://app.tenaxcode.com/trade-engine
  chart: https://app.tenaxcode.com

assets:
  appIcon: icon.png
  logo: logo.svg
  splashLogo: splash_logo.svg

# ✅ WebSocket configuration per brand
# Set unifiedStreamSocket to true to use the new single-socket path (/ws/stream with MessagePack)
# Set to false to use the legacy 5-socket path
featureFlags:
  unifiedStreamSocket: true
