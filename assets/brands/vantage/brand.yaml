name: vantage
type: parent
label: Vantage
themeMode: both

android:
  applicationId: com.vantage.app
  appName: Vantage

ios:
  bundleId: com.vantage.app
  appName: Vantage

colors:
  primary: "#5F259E"
  secondary: "#F8F3FF"
  accent: "#FFC93C"
  splashColor: "#5F259E"
  launcherBackground: "#5F259E"

urls:
  api: https://my.pipze.com/api/
  websocket: wss://my.pipze.com/trade-engine
  chart: https://my.pipze.com

assets:
  appIcon: icon.png
  logo: logo.svg
  splashLogo: splash_logo.svg

# ✅ WebSocket configuration per brand
# Set unifiedStreamSocket to true to use the new single-socket path (/ws/stream with MessagePack)
# Set to false to use the legacy 5-socket path
featureFlags:
  unifiedStreamSocket: true
