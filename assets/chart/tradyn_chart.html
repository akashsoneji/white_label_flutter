<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    html, body { width:100%; height:100%; overflow:hidden; }
    #tv_chart_container { width:100%; height:100%; }
  </style>
</head>
<body>
  <div id="tv_chart_container"></div>

  <!-- TradingView charting_library — must be placed in assets/charting_library/ -->
  <script src="charting_library/charting_library.standalone.js"></script>

  <script>
    // ── State ─────────────────────────────────────────────────────────────────
    var _tvWidget    = null;
    var _widgetReady = false;
    var _bidLine     = null;
    var _askLine     = null;

    // ── Bid / Ask line update ─────────────────────────────────────────────────
    window.__updateBidAsk = function(opts) {
      if (!_tvWidget || !_widgetReady) return;
      try {
        var chart = _tvWidget.activeChart();
        if (_bidLine) { try { chart.removeEntity(_bidLine); } catch(e){} _bidLine = null; }
        if (_askLine) { try { chart.removeEntity(_askLine); } catch(e){} _askLine = null; }
        var t = opts.time || (Date.now() / 1000);
        _bidLine = chart.createShape(
          { price: opts.bid, time: t },
          { shape: "horizontal_line", lock: true,
            disableSelection: true, disableSave: true, disableUndo: true,
            overrides: { linecolor: opts.bidColor, linewidth: 1, linestyle: 1,
              showLabel: true, horzLabelsAlign: "right", textcolor: opts.bidColor } }
        );
        _askLine = chart.createShape(
          { price: opts.ask, time: t },
          { shape: "horizontal_line", lock: true,
            disableSelection: true, disableSave: true, disableUndo: true,
            overrides: { linecolor: opts.askColor, linewidth: 1, linestyle: 1,
              showLabel: true, horzLabelsAlign: "right", textcolor: opts.askColor } }
        );
      } catch(e) { console.error("[Chart] updateBidAsk error:", e); }
    };

    // ── Position lines ────────────────────────────────────────────────────────
    var _positionLines = [];
    window.__renderPositionLines = function(lines) {
      if (!_tvWidget || !_widgetReady) return;
      try {
        var chart = _tvWidget.activeChart();
        _positionLines.forEach(function(l) { try { if (l && l._line) l.remove(); } catch(e){} });
        _positionLines = [];
        lines.forEach(function(l) {
          try {
            var line = chart.createPositionLine()
              .setText(l.text)
              .setQuantity(l.quantity)
              .setLineColor(l.color)
              .setExtendLeft(true)
              .setLineStyle(0)
              .setLineLength(50)
              .setPrice(l.price);
            _positionLines.push(line);
          } catch(e) { console.error("[Chart] positionLine error:", e); }
        });
      } catch(e) { console.error("[Chart] renderPositionLines error:", e); }
    };

    // ── Order lines ───────────────────────────────────────────────────────────
    var _orderLines = [];
    window.__renderOrderLines = function(lines) {
      if (!_tvWidget || !_widgetReady) return;
      try {
        var chart = _tvWidget.activeChart();
        _orderLines.forEach(function(l) { try { if (l) l.remove(); } catch(e){} });
        _orderLines = [];
        lines.forEach(function(l) {
          try {
            var line = chart.createOrderLine()
              .setText("Order")
              .setQuantity(l.quantity)
              .setPrice(l.price)
              .setLineStyle(0)
              .setLineLength(50);
            _orderLines.push(line);
          } catch(e) { console.error("[Chart] orderLine error:", e); }
        });
      } catch(e) { console.error("[Chart] renderOrderLines error:", e); }
    };

    // ── Theme change ──────────────────────────────────────────────────────────
    window.__changeTheme = function(t) {
      if (_tvWidget) { try { _tvWidget.changeTheme(t); } catch(e){} }
    };

    // ── Reset chart data (on reconnect) ───────────────────────────────────────
    window.__resetChart = function() {
      if (_tvWidget) { try { _tvWidget.activeChart().resetData(); } catch(e){} }
    };

    // ── Change symbol ─────────────────────────────────────────────────────────
    window.__changeSymbol = function(sym) {
      if (_tvWidget && _widgetReady) {
        try { _tvWidget.setSymbol(sym, _tvWidget.symbolInterval().interval, function(){}); }
        catch(e) { console.error("[Chart] changeSymbol error:", e); }
      }
    };

    // ── Change interval ───────────────────────────────────────────────────────
    window.__changeInterval = function(interval) {
      if (_tvWidget && _widgetReady) {
        try { _tvWidget.activeChart().setResolution(interval, function(){}); }
        catch(e) { console.error("[Chart] changeInterval error:", e); }
      }
    };

    // ── Flutter Datafeed Bridge ───────────────────────────────────────────────
    // TradingView calls these methods; we forward to Flutter via FlutterBridge
    // and Flutter resolves via window.__resolveDfCallback(cbId, result).
    (function() {
      var pendingCallbacks = {};
      var cbId = 0;

      function call(method, args, cb) {
        var id = ++cbId;
        if (cb) pendingCallbacks[id] = cb;
        try {
          FlutterBridge.postMessage(JSON.stringify({ method: method, args: args, cbId: id }));
        } catch(e) {
          console.error("[Datafeed] FlutterBridge not ready:", e);
        }
      }

      window.__resolveDfCallback = function(id, result) {
        var cb = pendingCallbacks[id];
        if (cb) { delete pendingCallbacks[id]; cb(result); }
      };

      window.__tradynDatafeed = {
        onReady: function(cb) {
          call('onReady', {}, cb);
        },
        getServerTime: function(cb) {
          call('getServerTime', {}, cb);
        },
        searchSymbols: function(q, exchange, type, cb) {
          call('searchSymbols', { q: q }, cb);
        },
        resolveSymbol: function(sym, onOk, onErr) {
          call('resolveSymbol', { sym: sym }, function(res) {
            if (res) onOk(res); else onErr('Cannot resolve symbol: ' + sym);
          });
        },
        getBars: function(info, resolution, params, onOk, onErr) {
          call('getBars', {
            symbol: info.name,
            resolution: resolution,
            from: params.from,
            to: params.to,
            countBack: params.countBack,
            firstDataRequest: params.firstDataRequest,
          }, function(r) {
            if (r && r.bars) onOk(r.bars, { noData: !!r.noData });
            else onErr('getBars failed');
          });
        },
        subscribeBars: function(info, resolution, cb, uid) {
          call('subscribeBars', { symbol: info.name, resolution: resolution, uid: uid });
          window['__rtCb_' + uid] = cb;
        },
        unsubscribeBars: function(uid) {
          call('unsubscribeBars', { uid: uid });
          delete window['__rtCb_' + uid];
        },
      };
    })();

    // ── Init TradingView widget ───────────────────────────────────────────────
    // Reads initial config injected by Flutter via __chartConfig
    function initWidget() {
      if (typeof TradingView === 'undefined') {
        console.log("[Chart] TradingView not ready, retrying...");
        setTimeout(initWidget, 200);
        return;
      }
      var cfg = window.__chartConfig || {};
      var symbol   = cfg.symbol   || 'EURUSD';
      var theme    = cfg.theme    || 'dark';
      var locale   = cfg.locale   || 'en';
      var bg       = cfg.bg       || '#131722';
      var clientId = cfg.clientId || '';
      var userId   = cfg.userId   || '';
      var storageUrl = cfg.storageUrl || '';

      _tvWidget = new TradingView.widget({
        library_path:   "charting_library/charting_library",
        fullscreen:     true,
        autosize:       true,
        symbol:         symbol,
        container:      "tv_chart_container",
        interval:       "1",
        datafeed:       window.__tradynDatafeed,
        timezone:       "exchange",
        theme:          theme,
        locale:         locale,
        loading_screen: { backgroundColor: bg },
        client_id:      clientId,
        user_id:        userId,
        load_last_chart:            !!storageUrl,
        auto_save_delay:            2,
        charts_storage_url:         storageUrl,
        charts_storage_api_version: "1.1",
        enabled_features: [
          "show_spread_operators",
          "move_logo_to_main_pane",
          "header_resolutions",
          "hide_left_toolbar_by_default",
          "show_hide_button_in_legend"
        ],
        disabled_features: [
          "use_localstorage_for_settings",
          "edit_buttons_in_legend",
          "control_bar",
          "border_around_the_chart",
          "header_compare",
          "adaptive_logo",
          "timeframes_toolbar",
          "widget_logo",
          "header_symbol_search",
          "header_screenshot",
          "left_toolbar",
          "header_fullscreen_button",
          "hide_main_series_symbol_from_indicator_legend",
          "header_saveload"
        ],
      });

      _tvWidget.onChartReady(function() {
        _widgetReady = true;
        // Notify Flutter
        try { FlutterBridge.postMessage(JSON.stringify({ type: "widgetReady" })); }
        catch(e) {}
      });

      // Auto-save chart layout
      _tvWidget.subscribe('onAutoSaveNeeded', function() {
        if (storageUrl) {
          _tvWidget.saveChartToServer(function(){}, function(){}, {
            chartName: 'Unnamed', defaultChartName: 'Unnamed'
          });
        }
      });
    }

    window.addEventListener('load', function() {
      setTimeout(initWidget, 100);
    });
  </script>
</body>
</html>
