<!DOCTYPE html>
<html>
<head>
<style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            background: transparent;
        }
		#chartContainer div:first-child {
			width: 100% !important;
			height: 100% !important;
		}

		#chartContainer {
			height: 96vh;
			width: 100% !important;
            /* padding: 10px !important; */

		}
	</style>
    <title>TradingView Chart</title>
    <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
    <script type="text/javascript">
        let selectedSymbol = "EURUSD";
        let chartWidget = null;

        function getThemeFromQuery() {
            try {
                // Allow native app to override via injected global
                if (typeof window !== 'undefined' && window.__tv_theme) {
                    const t = String(window.__tv_theme).toLowerCase();
                    return (t === "dark") ? "dark" : "light";
                }
                const params = new URLSearchParams(window.location.search || "");
                const theme = (params.get("theme") || "light").toLowerCase();
                return (theme === "dark") ? "dark" : "light";
            } catch (e) {
                return "light";
            }
        }

        function getSymbolFromQueryOrInjected() {
            try {
                if (typeof window !== 'undefined' && window.__tv_symbol) {
                    const s = String(window.__tv_symbol).trim();
                    if (s) return s;
                }
                const params = new URLSearchParams(window.location.search || "");
                const sym = (params.get("symbol") || "").trim();
                return sym || selectedSymbol;
            } catch (e) {
                return selectedSymbol;
            }
        }

        function updateSymbol(newSymbol) {
            selectedSymbol = newSymbol;
            console.log("Updated symbol:", selectedSymbol);
            createTradingViewChart(selectedSymbol);
        }

        function createTradingViewChart(symbol) {
            const chartContainer = document.getElementById('chartContainer');
            if (!chartContainer) {
                console.error("Chart container not found");
                return;
            }
            
            // Clear previous chart
            chartContainer.innerHTML = '';
            
            // Destroy existing widget if it exists
            if (chartWidget) {
                try {
                    chartWidget.remove();
                } catch (e) {
                    console.log("Error removing previous chart:", e);
                }
                chartWidget = null;
            }

            // Wait for TradingView to be available
            if (typeof TradingView === 'undefined') {
                console.log("TradingView not loaded yet, waiting...");
                setTimeout(function() {
                    createTradingViewChart(symbol);
                }, 100);
                return;
            }

            try {
                const theme = getThemeFromQuery();
                const toolbarBg = theme === "dark" ? "#0F172A" : "#f1f3f6";
                chartWidget = new TradingView.widget({
                    container_id: 'chartContainer',
                    symbol: symbol,
                    interval: '3',
                    timezone: 'Etc/UTC',
                    theme: theme,
                    style: '1',
                    locale: 'en',
                    toolbar_bg: toolbarBg,
                    enable_publishing: false,
                    allow_symbol_change: false,
                    details: false,
                    autosize: true,
                    hide_volume: true,  // Disable volume display
                });
                console.log("TradingView chart created for symbol:", symbol);
            } catch (e) {
                console.error("Error creating TradingView chart:", e);
            }
        }
        
        // Initialize chart when page loads
        window.addEventListener('load', function() {
            selectedSymbol = getSymbolFromQueryOrInjected();
            console.log('Page loaded, initializing chart for:', selectedSymbol);
            // Wait a bit for TradingView script to load
            setTimeout(function() {
                createTradingViewChart(selectedSymbol);
            }, 200);
        });
    </script>
</head>
<body>
    <div id="chartContainer"></div>
</body>
</html>
