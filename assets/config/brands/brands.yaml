# brands.yaml — Single Source of Truth
# One file drives Android flavors, Dart config, assets, and launch configs.
#
# type: parent  → brand has its own screen files in lib/screens/*/brands/{name}/
# type: child   → brand has NO screen files; uses inheritsFrom parent's screens
#
# Adding a new brand:
#   1. Add entry below
#   2. Run: dart run scripts/generate_brand_config.dart
#   3. Build: ./build.sh {brand} apk release

default: vantage

brands:
  # ─── PARENT BRAND ──────────────────────────────────────────────────────────
  # Vantage has its own screen/design files. All child flavors inherit from it.
  - name: vantage
    type: parent
    label: Vantage
    android:
      applicationId: com.vantage.app
      appName: Vantage
    ios:
      bundleId: com.vantage.app
      appName: Vantage
    colors:
      primary: "#5F259E"
      secondary: "#F8F3FF"
      accent: "#FFC93C"
    urls:
      api: https://my.pipze.com/api/
      websocket: wss://my.pipze.com/trade-engine
      chart: https://my.pipze.com
    assets:
      appIcon: assets/brands/vantage/icon.png
      logo: assets/brands/vantage/logo.svg
      splashLogo: assets/brands/vantage/splash_logo.svg

  # ─── CHILD BRAND ───────────────────────────────────────────────────────────
  # Celestial has NO screen files. Uses Vantage's screens with Celestial's theme.
  # To give Celestial its own design: create files in lib/screens/*/brands/celestial/
  - name: celestial
    type: child
    inheritsFrom: vantage
    label: Celestial
    android:
      applicationId: com.celestial.app
      appName: Celestial
    ios:
      bundleId: com.celestial.app
      appName: Celestial
    colors:
      primary: "#24324D"
      secondary: "#22D3EE"
      accent: "#24324D"
    urls:
      api: https://client.celestialtrader.com/api/
      websocket: wss://client.celestialtrader.com/trade-engine
      chart: https://client.celestialtrader.com
    assets:
      appIcon: assets/brands/celestial/icon.png
      logo: assets/brands/celestial/logo.svg
      splashLogo: assets/brands/celestial/splash_logo.svg

  - name: pipze
    type: child
    inheritsFrom: vantage
    label: Pipze
    android:
      applicationId: com.pipze.app
      appName: Pipze
    ios:
      bundleId: com.pipze.app
      appName: Pipze
    colors:
      primary: "#5F259E"
      secondary: "#F8F3FF"
      accent: "#FFC93C"
    urls:
      api: https://my.pipze.com/api/
      websocket: wss://my.pipze.com/trade-engine
      chart: https://my.pipze.com
    assets:
      appIcon: assets/brands/pipze/icon.png
      logo: assets/brands/pipze/icon.png
      splashLogo: assets/brands/pipze/icon.png